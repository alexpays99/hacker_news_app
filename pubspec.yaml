name: hacker_news_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.1 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # State management and DI
  flutter_riverpod: ^2.3.0
  riverpod_annotation: ^2.0.0

  # Navigation
  go_router: ^6.5.0

  # Network
  dio: ^5.0.0
  retrofit: ^4.0.1
  pretty_dio_logger: ^1.3.1

  # Models
  freezed_annotation: ^2.2.0
  json_annotation: ^4.8.0

  # Utils
  url_launcher: ^6.1.10
  intl: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  
  # Code generation
  build_runner: ^2.3.3
  freezed: ^2.3.2
  json_serializable: ^6.6.1
  retrofit_generator: ^6.0.0+1
  riverpod_generator: ^2.1.0

flutter:
  uses-material-design: true
