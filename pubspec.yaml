name: hacker_news_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # State management and DI
  flutter_riverpod: ^2.4.3
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^6.5.0

  # Network
  dio: ^5.3.3
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1

  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Utils
  url_launcher: ^6.1.14
  intl: ^0.18.0
  cached_network_image: ^3.2.3
  get_it: ^7.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  
  # Code generation
  build_runner: ^2.4.6
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.1
  riverpod_generator: ^2.3.3

flutter:
  uses-material-design: true
